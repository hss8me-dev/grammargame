<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grammar Mission: Quest for the Treasure</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* ===== EDIT COLORS HERE ===== */
:root{--ink:#1b1b1b;--paper:#f2ead3;--grass:#5b9c3a;--dirt:#8a5a35;--gold:#f5c542;--red:#d9382b;--green:#2e9e3f;--blue:#3a6fd8;--bg:#3b7a2a}
*{box-sizing:border-box}
body{margin:0;font-family:'Press Start 2P',monospace;font-size:12px;line-height:1.7;color:var(--ink);background:var(--bg);min-height:100vh;
 background-image:linear-gradient(90deg,rgba(0,0,0,.12) 50%,transparent 50%),linear-gradient(rgba(0,0,0,.12) 50%,transparent 50%);background-size:32px 32px;transition:background-color .6s}
body.forest{--bg:#3b7a2a}body.cave{--bg:#4a4a55}body.desert{--bg:#c9a85a}body.nether{--bg:#7a1e14}body.end{--bg:#2a1a4a}
main{max-width:760px;margin:0 auto;padding:12px}
.card{background:var(--paper);border:5px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.45);padding:14px;margin-bottom:12px}
/* school logo + credit */.logo{background:#fff;border:4px solid var(--ink);padding:8px;text-align:center}.logo img{max-width:100%;height:auto;max-height:110px}.by{font-size:12px;margin:10px 0 0}
h1{font-size:20px;margin:6px 0;line-height:1.4}h2{font-size:14px;margin:4px 0}
button,input,select{font-family:inherit;font-size:12px}
.btn{background:var(--green);color:#fff;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:12px 14px;cursor:pointer;margin:6px 4px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}.btn.alt{background:var(--blue)}.btn.gold{background:var(--gold);color:var(--ink)}
.btn:focus-visible,.opt:focus-visible{outline:4px solid #fff;outline-offset:2px}
input,select{padding:10px;border:4px solid var(--ink);background:#fff;width:100%;margin:6px 0}
.hidden{display:none!important}
.hud{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;background:var(--ink);color:#fff;padding:8px 10px;border:4px solid #000}
.path{display:flex;gap:2px;margin:8px 0;overflow:hidden}.path i{flex:1;height:10px;background:#555}.path i.done{background:var(--gold)}.path i.now{background:#fff}.path i.boss{height:16px;background:#a33}
.arena{text-align:center;position:relative;padding:8px}
.monster{font-size:72px;line-height:1.1;display:inline-block;image-rendering:pixelated}.monster.boss{font-size:110px;filter:drop-shadow(0 0 10px #f00)}
.hp{height:18px;border:4px solid var(--ink);background:#400;margin:6px auto;max-width:300px}.boss+.hp,.hp.boss{max-width:460px;height:26px}
.hp b{display:block;height:100%;background:var(--red);transition:width .6s}
.taunt{background:#fff;border:3px solid var(--ink);padding:6px;display:inline-block;margin:6px 0}
.timer{height:10px;background:#222;margin:6px 0}.timer b{display:block;height:100%;background:var(--gold);width:100%}
.prompt{font-size:20px;line-height:1.9;margin:10px 0}.prompt u{text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:5px;background:#fff3a3}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{text-align:left;background:#fff;border:4px solid var(--ink);padding:12px;cursor:pointer;line-height:1.6}
.opt:hover{background:#ffe9a8}.opt.ok{background:#8be28b}.opt.no{background:#ff9a90}.opt:disabled{cursor:default}
.tf{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}.tf .opt{text-align:center;font-size:16px;padding:20px}
.fb{border:4px solid var(--ink);padding:10px;margin-top:10px}.fb.ok{background:#c9f5c9}.fb.no{background:#ffd0cb}
.slash{position:absolute;left:10%;top:40%;width:80%;height:8px;background:#fff;box-shadow:0 0 12px #fff;transform:rotate(-30deg);animation:sl .3s forwards}
@keyframes sl{from{opacity:1;clip-path:inset(0 100% 0 0)}to{opacity:0;clip-path:inset(0 0 0 0)}}
.hit{animation:shake .4s}@keyframes shake{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.poof{animation:poof .6s forwards}@keyframes poof{to{transform:scale(1.8);opacity:0;filter:blur(6px)}}
.boom{animation:boom .7s forwards}@keyframes boom{40%{transform:scale(1.6);filter:brightness(4)}to{transform:scale(2.2);opacity:0}}
.hurt{animation:hurt .5s}@keyframes hurt{50%{background:#f00}}
.heroes{display:flex;flex-wrap:wrap;gap:6px}.heroes button{font-size:30px;background:#fff;border:4px solid var(--ink);cursor:pointer}.heroes .sel{background:var(--gold)}
.dots::after{content:'';animation:d 1.2s steps(4) infinite}@keyframes d{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin:14px 0;min-height:170px}
.podium div{width:30%;text-align:center;border:4px solid var(--ink);background:var(--dirt);color:#fff;padding:6px 2px;font-size:10px;word-break:break-word}
.podium .p1{height:150px;background:var(--gold);color:var(--ink)}.podium .p2{height:115px;background:#c0c0c0;color:var(--ink)}.podium .p3{height:90px}
table{width:100%;border-collapse:collapse;font-size:10px}td,th{border:3px solid var(--ink);padding:6px;text-align:left}
.chest{font-size:80px;text-align:center}.chest.open{animation:pop 1s}@keyframes pop{50%{transform:scale(1.5) rotate(8deg)}}
.spark{position:fixed;top:-20px;font-size:22px;animation:fall 2.5s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#mute{position:fixed;top:8px;right:8px;z-index:9}
@media(max-width:560px){.opts{grid-template-columns:1fr}h1{font-size:15px}.prompt{font-size:16px}.monster{font-size:56px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head><body class="forest">

 <p>Fight a monster in every question. Answer right to win the battle. Answer wrong and the monster wins that round, but you keep going. Reach the treasure chest at the end!</p>
 <p>⌨️ Keys: A–D to answer, T/F for True/False, Enter for next.</p>
 <button class="btn" onclick="heroPick()">⚔️ Start Mission</button><button class="btn alt" onclick="teacher()">🎓 Teacher panel</button></div>`}
function heroPick(){S.hero=HEROES[0];
 app.innerHTML=`<div class="card"><h2>Choose your hero</h2><div class="heroes">${HEROES.map((h,i)=>`<button class="${i?'':'sel'}" aria-label="Hero ${i+1}" onclick="S.hero='${h}';document.querySelectorAll('.heroes button').forEach(b=>b.classList.remove('sel'));this.classList.add('sel')">${h}</button>`).join('')}</div>
 <label>Nickname<input id="nick" maxlength="14" placeholder="Your hero name"></label>
 <label>Room code<input id="room" value="${cfg.room}" inputmode="numeric"></label>
 <button class="btn" onclick="begin()">Enter the Forest</button><button class="btn alt" onclick="home()">Back</button></div>`}
function teacher(){
 app.innerHTML=`<div class="card"><h2>🎓 Teacher panel</h2><p>Room code: <b>${cfg.room}</b></p>
 <label><input type="checkbox" id="t3" ${cfg.shuffle?'checked':''} style="width:auto"> Shuffle questions inside each section</label>
 <button class="btn" onclick="cfg.shuffle=t3.checked;save();home()">Save</button>
 <h2>Live progress (${results().length} finished)</h2>${board(results())}
 <button class="btn gold" onclick="reveal()">🏆 Reveal Winner</button>
 <button class="btn alt" onclick="if(confirm('Clear all results?')){localStorage.removeItem('mcg_results');teacher()}">Clear results</button><button class="btn alt" onclick="home()">Back</button></div>`}
function begin(){const name=($('#nick').value||'Steve').trim();cfg.room=$('#room').value||cfg.room;save();
 let qs=[];for(const k of Object.keys(SECTIONS)){let g=QUESTIONS.filter(q=>q.section===k);if(cfg.shuffle)g=g.sort(()=>Math.random()-.5);qs=qs.concat(g)}
 S={name,hero:S.hero||HEROES[0],qs,i:0,ok:0,bad:0,hearts:3,ms:0,t0:0};next()}
function next(){if(S.i>=S.qs.length)return finish();
 const q=S.qs[S.i];document.body.className=biome(S.i);
 if(S.i%5===0&&S.i)S.hearts=3;/* hearts refill at each new biome */
 const boss=BOSSES[q.id],mob=boss||pickMob(q);S.mob=mob;S.locked=false;
 const first=S.i===0||S.qs[S.i-1].section!==q.section;
 app.innerHTML=`<div class="hud"><span>${S.hero} ${S.name}</span><span>Battle ${S.i+1}/${S.qs.length}</span><span id="hp" aria-label="lives">${'❤️'.repeat(S.hearts)||'💔'}</span><span>⭐ ${S.ok*10}</span></div>
 <div class="path" aria-hidden="true">${S.qs.map((x,j)=>`<i class="${j<S.i?'done':j===S.i?'now':BOSSES[x.id]?'boss':''}"></i>`).join('')}<span>🧰</span></div>
 <div class="card">${first?`<p><b>${SECTIONS[q.section].title}</b><br>${SECTIONS[q.section].instr}</p>`:''}
 <div class="arena" id="arena">${boss?'<h2>⚠️ BOSS: '+mob.n+'</h2>':'<h2>'+mob.n+'</h2>'}<div class="monster ${boss?'boss':''}" id="mon">${mob.e}</div>
 <div class="hp ${boss?'boss':''}"><b id="hpbar" style="width:100%"></b></div><div class="taunt">💬 ${TAUNTS[S.i%TAUNTS.length]}</div></div>
 <div class="prompt">${html(q.prompt)}</div>
 <div class="opts">${q.type==='tf'?'<div class="tf">'+['TRUE','FALSE'].map(o=>`<button class="opt" data-k="${o}">${o==='TRUE'?'✅':'❌'} ${o}</button>`).join('')+'</div>':q.options.map((o,j)=>`<button class="opt" data-k="${'ABCD'[j]}"><b>${'ABCD'[j]}.</b> ${o}</button>`).join('')}</div>
 <div id="fb"></div></div>`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.k));
 S.t0=performance.now();clearInterval(tick);}
function pickMob(q){const a=MOBS[q.section];return{n:a[S.i%a.length][0],e:a[S.i%a.length][1]}}
function answer(k){if(S.locked)return;S.locked=true;clearInterval(tick);
 const q=S.qs[S.i],t=performance.now()-S.t0;S.ms+=t;
 const good=k===q.correctAnswer,arena=$('#arena'),mon=$('#mon');
 document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.k===q.correctAnswer)b.classList.add('ok');else if(b.dataset.k===k)b.classList.add('no')});
 let msg;
 if(good){S.ok++;sfx.ok();arena.insertAdjacentHTML('beforeend','<div class="slash"></div>');mon.classList.add('hit');$('#hpbar').style.width='0%';setTimeout(()=>mon.classList.add('poof'),350);msg='✅ Direct hit! You defeated '+S.mob.n+'! +10 points.'}
 else{S.bad++;S.hearts=Math.max(0,S.hearts-1);sfx.no();mon.classList.add(BOSSES[q.id]||S.mob.e==='🟩'?'boom':'hit');document.body.classList.add('hurt');setTimeout(()=>document.body.classList.remove('hurt'),500);
  $('#hp').textContent=S.hearts?'❤️'.repeat(S.hearts):'💔';
  const ans=q.type==='tf'?q.correctAnswer:q.correctAnswer+'. '+q.options['ABCD'.indexOf(q.correctAnswer)];
  msg='❌ '+S.mob.n+' won this round. Correct answer: <b>'+ans+'</b>'}
 $('#fb').innerHTML=`<div class="fb ${good?'ok':'no'}" role="status">${msg}<br>💡 ${q.explanation}</div><button class="btn" id="nx" autofocus>${S.i+1>=S.qs.length?'Open the chest ➜':'Next battle ➜'}</button>`;
 $('#nx').onclick=()=>{S.i++;next()};$('#nx').focus()}
function finish(){clearInterval(tick);document.body.className='end';
 const r=results();r.push({name:S.name,hero:S.hero,ok:S.ok,bad:S.bad,ms:Math.round(S.ms)});localStorage.setItem('mcg_results',JSON.stringify(r));
 let n=0;const d=setInterval(()=>{sfx.drum();if(++n>6)clearInterval(d)},450);
 app.innerHTML=`<div class="card" style="text-align:center"><div class="chest">🧰</div><h2>Waiting for the final results<span class="dots"></span></h2>
 <p>The other heroes are still fighting...</p><p>${S.hero} ${S.name}: ✅ ${S.ok} correct · ❌ ${S.bad} wrong · ⏱ ${fmt(S.ms)}</p>
 <button class="btn alt" onclick="heroPick()">Next student</button><button class="btn gold" onclick="reveal()">🏆 Reveal Winner (teacher)</button></div>`}
function board(r){r=[...r].sort((a,b)=>b.ok-a.ok||a.ms-b.ms);
 return r.length?`<table><tr><th>#</th><th>Hero</th><th>✅</th><th>Time</th></tr>${r.map((x,i)=>`<tr><td>${i+1}</td><td>${x.hero} ${x.name}</td><td>${x.ok}/${QUESTIONS.length}</td><td>${fmt(x.ms)}</td></tr>`).join('')}</table>`:'<p>No results yet.</p>'}
function reveal(){const r=[...results()].sort((a,b)=>b.ok-a.ok||a.ms-b.ms);sfx.win();
 const P=(x,c)=>x?`<div class="${c}">${c==='p1'?'👑<br>':''}${x.hero}<br>${x.name}<br>${x.ok} ✅</div>`:'';
 app.innerHTML=`<div class="card" style="text-align:center"><h1>🏆 Final Results</h1>
 <div class="podium">${P(r[1],'p2')}${P(r[0],'p1')}${P(r[2],'p3')}</div>
 <div class="chest open">🧰✨</div><h2>${REWARD_TEXT}</h2>
 <p>Ranking: most correct answers first, then fastest total time.</p>${board(r)}
 <button class="btn" onclick="heroPick()">Play Again</button><button class="btn alt" onclick="home()">Home</button></div>`;
 for(let i=0;i<40;i++){const s=document.createElement('span');s.className='spark';s.textContent=['🪙','✨','⭐','🎉'][i%4];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),4500)}}
document.addEventListener('keydown',e=>{const k=e.key.toUpperCase(),nx=$('#nx');
 if(e.key==='Enter'&&nx&&S.locked){nx.click();return}
 if(!$('.opt')||S.locked||e.target.tagName==='INPUT')return;
 const q=S.qs[S.i];if(q.type==='tf'){if(k==='T')answer('TRUE');if(k==='F')answer('FALSE')}else if('ABCD'.includes(k)&&k.length===1)answer(k)});
home();
</script></body></html>
